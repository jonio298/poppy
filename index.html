<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111914">
  <title>In Loving Memory of Charles Ross</title>
  <style>
    :root { color-scheme: dark; --deep:#111914; --cream:#f5f1e8; --gold:#d8ba7a; --sage:#b9c6b2; }
    * { box-sizing:border-box; }
    html, body { width:100%; height:100%; margin:0; overflow:hidden; background:var(--deep); }
    body { font-family:Georgia, "Times New Roman", serif; color:var(--cream); }
    button { font:inherit; }
    .stage { position:fixed; inset:0; display:grid; place-items:center; background:radial-gradient(circle at 50% 35%, #1d2a22 0, var(--deep) 62%); }
    .slide { position:absolute; inset:0; display:grid; place-items:center; overflow:hidden; opacity:0; transform:scale(1.012); transition:opacity 1.1s ease, transform 1.1s ease; pointer-events:none; }
    .slide.active { opacity:1; transform:scale(1); pointer-events:auto; }
    .photo { display:block; width:auto; height:auto; max-width:calc(100vw - clamp(36px, 6vw, 84px)); max-height:calc(100vh - clamp(54px, 8vw, 110px)); object-fit:contain; object-position:center; filter:drop-shadow(0 22px 50px rgba(0,0,0,.38)); }
    .date { position:absolute; left:clamp(22px,4vw,64px); bottom:clamp(24px,4vw,54px); color:var(--gold); font:700 clamp(.72rem,1.1vw,.95rem)/1 Arial,sans-serif; letter-spacing:.16em; text-transform:uppercase; text-shadow:0 2px 12px #000; }
    .cover { grid-template-columns:minmax(300px, .9fr) minmax(340px, .75fr); gap:clamp(32px,6vw,92px); padding:clamp(38px,7vw,110px); }
    .cover-copy { align-self:center; max-width:650px; }
    .eyebrow { margin:0 0 28px; color:var(--gold); font-size:clamp(1.15rem,2vw,1.65rem); font-weight:700; }
    h1 { margin:0; color:var(--cream); font-size:clamp(3.5rem,7vw,6.6rem); font-weight:400; line-height:.96; }
    .rule { width:92px; height:1px; margin:34px 0 28px; background:var(--gold); }
    .names { margin:0; color:#deddd3; font-size:clamp(1.15rem,2vw,1.7rem); font-style:italic; word-spacing:.42em; }
    .portrait { width:100%; height:min(78vh,760px); object-fit:contain; filter:drop-shadow(0 24px 60px rgba(0,0,0,.4)); }
    .begin { margin-top:42px; padding:13px 22px; border:1px solid rgba(216,186,122,.7); border-radius:999px; background:rgba(17,25,20,.72); color:var(--cream); cursor:pointer; font:700 .82rem Arial,sans-serif; letter-spacing:.1em; text-transform:uppercase; }
    .chrome { position:fixed; inset:0; z-index:10; pointer-events:none; opacity:0; transition:opacity .3s ease; }
    body:hover .chrome, body.controls-visible .chrome, .chrome:focus-within { opacity:1; }
    .topline { position:absolute; top:0; left:0; right:0; height:90px; padding:22px clamp(22px,4vw,62px); display:flex; justify-content:space-between; background:linear-gradient(rgba(8,12,10,.78),transparent); font:700 .72rem Arial,sans-serif; letter-spacing:.14em; text-transform:uppercase; color:var(--sage); }
    .controls { position:absolute; right:clamp(18px,3vw,42px); bottom:clamp(18px,3vw,38px); display:flex; gap:10px; pointer-events:auto; }
    .control { width:46px; height:46px; border:1px solid rgba(255,255,255,.22); border-radius:50%; background:rgba(12,18,15,.86); color:var(--cream); cursor:pointer; display:grid; place-items:center; font-family:Arial,sans-serif; }
    .control:hover, .control:focus-visible { border-color:var(--gold); color:var(--gold); outline:none; }
    .progress { position:absolute; left:0; bottom:0; height:3px; width:0; background:var(--gold); transition:width .45s ease; }
    .hint { position:absolute; left:clamp(22px,4vw,62px); bottom:clamp(22px,3vw,42px); color:rgba(245,241,232,.62); font:600 .68rem Arial,sans-serif; letter-spacing:.09em; text-transform:uppercase; }
    @media (max-width:760px) {
      .cover { grid-template-columns:1fr; grid-template-rows:auto 1fr; text-align:center; gap:22px; padding:70px 24px 28px; }
      .cover-copy { order:2; align-self:start; }
      .portrait { order:1; height:45vh; }
      .rule { margin:24px auto 20px; }
      .begin { margin-top:26px; }
      .hint { display:none; }
    }
    @media (prefers-reduced-motion:reduce) { .slide { transition:none; } }
  </style>
</head>
<body class="controls-visible">
  <main class="stage" id="stage" aria-live="polite">
    <section class="slide cover active" id="cover">
      <div class="cover-copy">
        <p class="eyebrow">In Loving Memory</p>
        <h1>Charles Ross</h1>
        <div class="rule"></div>
        <p class="names">“Charlie” &nbsp; “Dad” &nbsp; “Poppy”</p>
        <button class="begin" id="begin">Begin slideshow</button>
      </div>
      <img class="portrait" src="photos/098_UNDATED_Charlie Portrait.webp" alt="Portrait of Charles Ross">
    </section>
  </main>

  <div class="chrome" aria-label="Slideshow controls">
    <div class="topline"><span>In Loving Memory · Charles Ross</span><span id="counter">Opening</span></div>
    <div class="hint">Arrow keys to navigate · F for full screen</div>
    <div class="controls">
      <button class="control" id="previous" aria-label="Previous slide">‹</button>
      <button class="control" id="playPause" aria-label="Pause slideshow">Ⅱ</button>
      <button class="control" id="next" aria-label="Next slide">›</button>
      <button class="control" id="fullscreen" aria-label="Enter full screen">⛶</button>
    </div>
    <div class="progress" id="progress"></div>
  </div>

  <script>
    const INTERVAL = 12000;
    const stage = document.getElementById('stage');
    const counter = document.getElementById('counter');
    const progress = document.getElementById('progress');
    const playPause = document.getElementById('playPause');
    let slides = [document.getElementById('cover')];
    let current = 0;
    let playing = false;
    let timer;

    function show(index) {
      current = Math.max(0, Math.min(index, slides.length - 1));
      slides.forEach((slide, i) => slide.classList.toggle('active', i === current));
      counter.textContent = current === 0 ? 'Opening' : `${String(current).padStart(3, '0')} / ${slides.length - 1}`;
      progress.style.width = `${(current / (slides.length - 1)) * 100}%`;
      const upcoming = slides[current + 1]?.querySelector('img');
      if (upcoming) upcoming.loading = 'eager';
      if (playing) schedule();
    }

    function schedule() {
      clearTimeout(timer);
      if (!playing) return;
      if (current >= slides.length - 1) { pause(); return; }
      timer = setTimeout(() => show(current + 1), INTERVAL);
    }

    function play() { playing = true; playPause.textContent = 'Ⅱ'; playPause.setAttribute('aria-label', 'Pause slideshow'); schedule(); }
    function pause() { playing = false; clearTimeout(timer); playPause.textContent = '▶'; playPause.setAttribute('aria-label', 'Play slideshow'); }
    function togglePlay() { playing ? pause() : play(); }
    async function enterFullscreen() { if (!document.fullscreenElement) await document.documentElement.requestFullscreen?.(); else await document.exitFullscreen?.(); }

    fetch('photos.json').then(r => r.json()).then(photos => {
      const fragment = document.createDocumentFragment();
      photos.forEach((photo, i) => {
        const section = document.createElement('section');
        section.className = 'slide';
        const img = document.createElement('img');
        img.className = 'photo';
        img.src = `photos/${photo.file}`;
        img.alt = photo.caption || `Photo ${i + 1} of Charles Ross and family`;
        img.loading = i < 2 ? 'eager' : 'lazy';
        img.decoding = 'async';
        section.append(img);
        if (photo.date) {
          const label = document.createElement('div');
          label.className = 'date';
          label.textContent = photo.date;
          section.append(label);
        }
        fragment.append(section);
      });
      stage.append(fragment);
      slides = [...stage.querySelectorAll('.slide')];
      show(0);
    });

    document.getElementById('begin').addEventListener('click', async () => { await enterFullscreen(); show(1); play(); });
    document.getElementById('previous').addEventListener('click', () => show(current - 1));
    document.getElementById('next').addEventListener('click', () => show(current + 1));
    document.getElementById('playPause').addEventListener('click', togglePlay);
    document.getElementById('fullscreen').addEventListener('click', enterFullscreen);
    document.addEventListener('keydown', event => {
      if (['ArrowRight', 'ArrowDown', 'PageDown'].includes(event.key)) show(current + 1);
      else if (['ArrowLeft', 'ArrowUp', 'PageUp'].includes(event.key)) show(current - 1);
      else if (event.key === ' ') { event.preventDefault(); togglePlay(); }
      else if (event.key.toLowerCase() === 'f') enterFullscreen();
      else if (event.key === 'Home') show(0);
      else if (event.key === 'End') show(slides.length - 1);
    });
    let controlsTimer;
    document.addEventListener('mousemove', () => {
      document.body.classList.add('controls-visible');
      clearTimeout(controlsTimer);
      controlsTimer = setTimeout(() => document.body.classList.remove('controls-visible'), 2200);
    });
  </script>
</body>
</html>
