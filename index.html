<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0e1511">
  <title>In Loving Memory of Charles Ross</title>
  <style>
    :root { color-scheme: dark; --deep:#0e1511; --cream:#f5f1e8; --gold:#d8ba7a; --sage:#b9c6b2; --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px); --fx:1.7s; }
    * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    html, body { width:100%; height:100%; margin:0; overflow:hidden; background:var(--deep); overscroll-behavior:none; }
    body { font-family:Georgia, "Times New Roman", serif; color:var(--cream); touch-action:pan-y pinch-zoom; }
    button { font:inherit; }

    .stage { position:fixed; inset:0; background:radial-gradient(circle at 50% 30%, #203027 0, var(--deep) 66%); }

    /* ---------- Slides ---------- */
    .slide { position:absolute; inset:0; display:grid; place-items:center; overflow:hidden; visibility:hidden; background:var(--deep); }
    .slide.leaving { visibility:visible; z-index:1; }
    .slide.active { visibility:visible; z-index:2; }
    .backdrop { position:absolute; inset:-10%; background-size:cover; background-position:center; filter:blur(50px) saturate(1.2) brightness(.4); }
    .photo { position:relative; display:block; width:calc(100% - clamp(24px,7vw,110px)); height:calc(100% - clamp(80px,12vw,150px)); max-width:100%; object-fit:contain; filter:drop-shadow(0 20px 50px rgba(0,0,0,.5)); }
    .slide.active .photo { animation:drift 16s ease-out both; }
    @keyframes drift { from { transform:scale(1); } to { transform:scale(1.045); } }
    .date { position:absolute; left:clamp(18px,4vw,64px); bottom:calc(var(--safe-b) + clamp(84px,6vw,60px)); padding:9px 16px 8px; border:1px solid rgba(216,186,122,.45); border-radius:999px; background:rgba(10,15,12,.55); -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px); color:var(--gold); font:700 clamp(.72rem,1.1vw,.9rem)/1 Arial,sans-serif; letter-spacing:.2em; text-transform:uppercase; }
    .slide.active .date { animation:dateIn 1.2s .9s ease both; }
    @keyframes dateIn { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:none; } }

    /* ---------- Transitions: the new photo plays one of these over the old one ---------- */
    .slide.entering { animation-duration:var(--fx); animation-timing-function:cubic-bezier(.65,0,.25,1); animation-fill-mode:both; }
    .fx-fade.entering   { animation-name:fxFade; }
    .fx-slide.entering  { animation-name:fxSlide; }
    .fx-zoom.entering   { animation-name:fxZoom; }
    .fx-wipe.entering   { animation-name:fxWipe; }
    .fx-blur.entering   { animation-name:fxBlur; }
    .fx-rise.entering   { animation-name:fxRise; }
    .fx-iris.entering   { animation-name:fxIris; }
    .fx-door.entering   { animation-name:fxDoor; }
    @keyframes fxFade  { from { opacity:0; } to { opacity:1; } }
    @keyframes fxSlide { from { transform:translateX(calc(100% * var(--dir,1))); } to { transform:none; } }
    @keyframes fxZoom  { from { opacity:0; transform:scale(1.35); } to { opacity:1; transform:none; } }
    @keyframes fxWipe  { from { clip-path:inset(0 100% 0 0); } to { clip-path:inset(0 0 0 0); } }
    @keyframes fxBlur  { from { opacity:0; filter:blur(36px); transform:scale(1.06); } to { opacity:1; filter:blur(0); transform:none; } }
    @keyframes fxRise  { from { opacity:0; transform:translateY(14%); } to { opacity:1; transform:none; } }
    @keyframes fxIris  { from { clip-path:circle(0% at 50% 50%); } to { clip-path:circle(78% at 50% 50%); } }
    @keyframes fxDoor  { from { clip-path:inset(0 50% 0 50%); } to { clip-path:inset(0 0 0 0); } }

    /* ---------- Cover ---------- */
    .cover { grid-template-columns:minmax(300px,.9fr) minmax(340px,.75fr); gap:clamp(32px,6vw,92px); padding:clamp(38px,7vw,110px); background:radial-gradient(circle at 24% 80%, rgba(216,186,122,.1), transparent 40%), radial-gradient(circle at 50% 35%, #203027 0, var(--deep) 66%); }
    .cover-copy { align-self:center; max-width:650px; animation:rise 1.6s ease both; }
    .eyebrow { margin:0 0 24px; color:var(--gold); font-size:clamp(1.05rem,2vw,1.6rem); font-weight:700; letter-spacing:.04em; }
    h1 { margin:0; color:var(--cream); font-size:clamp(3.2rem,7vw,6.5rem); font-weight:400; line-height:.98; }
    .rule { width:92px; height:1px; margin:32px 0 26px; background:linear-gradient(90deg,var(--gold),transparent); }
    .names { margin:0; color:#deddd3; font-size:clamp(1.1rem,2vw,1.65rem); font-style:italic; word-spacing:.4em; }
    .portrait { width:100%; height:min(78dvh,760px); object-fit:contain; filter:drop-shadow(0 24px 60px rgba(0,0,0,.5)); animation:rise 2.2s ease both; }
    @keyframes rise { from { opacity:0; transform:translateY(14px); } to { opacity:1; transform:none; } }
    .begin { margin-top:38px; min-height:48px; padding:14px 28px; border:1px solid rgba(216,186,122,.75); border-radius:999px; background:rgba(216,186,122,.08); color:var(--cream); cursor:pointer; font:700 .82rem Arial,sans-serif; letter-spacing:.14em; text-transform:uppercase; transition:background .25s,color .25s; }
    .begin:hover:not(:disabled), .begin:focus-visible { background:var(--gold); color:#111914; outline:none; }
    .begin:disabled { cursor:wait; opacity:.55; }

    /* ---------- Controls ---------- */
    .chrome { position:fixed; inset:0; z-index:10; pointer-events:none; opacity:0; transition:opacity .35s ease; }
    body.controls-visible .chrome { opacity:1; }
    .topline { position:absolute; top:0; left:0; right:0; padding:calc(var(--safe-t) + 18px) clamp(18px,4vw,56px) 40px; display:flex; justify-content:space-between; gap:12px; background:linear-gradient(rgba(6,10,8,.8),transparent); font:700 .7rem Arial,sans-serif; letter-spacing:.14em; text-transform:uppercase; color:var(--sage); }
    .controls { position:absolute; left:50%; bottom:calc(var(--safe-b) + 18px); transform:translateX(-50%); display:flex; gap:6px; padding:8px; border-radius:999px; background:rgba(10,15,12,.72); border:1px solid rgba(255,255,255,.12); -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px); pointer-events:auto; }
    body:not(.controls-visible) .controls { pointer-events:none; }
    body.on-cover .controls, body.on-cover .hint { display:none; }
    .control { width:48px; height:48px; border:0; border-radius:50%; background:transparent; color:var(--cream); cursor:pointer; display:grid; place-items:center; }
    .control svg { width:22px; height:22px; fill:currentColor; }
    .control:hover, .control:focus-visible { background:rgba(216,186,122,.16); color:var(--gold); outline:none; }
    .control[hidden] { display:none; }
    .progress { position:absolute; left:0; bottom:0; height:3px; width:0; background:linear-gradient(90deg,transparent,var(--gold)); transition:width .45s ease; }
    .hint { position:absolute; left:clamp(22px,4vw,56px); bottom:calc(var(--safe-b) + 34px); color:rgba(245,241,232,.55); font:600 .66rem Arial,sans-serif; letter-spacing:.09em; text-transform:uppercase; }
    .swipe-tip { position:fixed; z-index:11; left:50%; bottom:calc(var(--safe-b) + 92px); transform:translateX(-50%); padding:8px 16px; border-radius:999px; background:rgba(10,15,12,.8); color:var(--sage); font:600 .72rem Arial,sans-serif; letter-spacing:.1em; text-transform:uppercase; opacity:0; pointer-events:none; transition:opacity .6s; white-space:nowrap; }
    .swipe-tip.show { opacity:1; }

    /* ---------- Phones ---------- */
    @media (max-width:760px) {
      .cover { grid-template-columns:1fr; grid-template-rows:minmax(0,1fr) auto; text-align:center; gap:18px; padding:calc(var(--safe-t) + 28px) 24px calc(var(--safe-b) + 32px); }
      .cover-copy { order:2; align-self:start; }
      .portrait { order:1; height:100%; min-height:0; max-height:46dvh; align-self:end; }
      .rule { margin:22px auto 18px; background:linear-gradient(90deg,transparent,var(--gold),transparent); }
      .begin { margin-top:24px; width:100%; max-width:320px; }
      .eyebrow { margin-bottom:14px; }
      .hint { display:none; }
      .topline span:first-child { display:none; }
      .topline { justify-content:center; }
      .photo { width:calc(100% - 20px); height:calc(100% - 190px); }
      .date { left:50%; transform:translateX(-50%); bottom:calc(var(--safe-b) + 86px); }
      .slide.active .date { animation-name:dateInMobile; }
      @keyframes dateInMobile { from { opacity:0; } to { opacity:1; } }
    }
    @media (max-height:520px) and (orientation:landscape) {
      .photo { width:calc(100% - 24px); height:calc(100% - 24px); }
      .date { left:18px; bottom:14px; transform:none; }
      .controls { left:auto; right:14px; transform:none; bottom:10px; }
      .control { width:42px; height:42px; }
      .cover { grid-template-columns:1fr 1fr; padding:20px 32px; gap:24px; text-align:left; }
      .portrait { height:80dvh; max-height:none; }
      h1 { font-size:2.6rem; }
      .rule { margin:16px 0; background:linear-gradient(90deg,var(--gold),transparent); }
      .begin { margin-top:16px; width:auto; }
      .hint, .swipe-tip { display:none; }
    }
    @media (prefers-reduced-motion:reduce) {
      .slide.entering { animation:fxFade .5s both !important; }
      .slide.active .photo, .cover-copy, .portrait { animation:none; }
    }
  </style>
</head>
<body class="controls-visible on-cover">
  <main class="stage" id="stage" aria-live="polite">
    <section class="slide cover active" id="cover">
      <div class="cover-copy">
        <p class="eyebrow">In Loving Memory</p>
        <h1>Charles Ross</h1>
        <div class="rule"></div>
        <p class="names">“Charlie” &nbsp; “Dad” &nbsp; “Poppy”</p>
        <button class="begin" id="begin" disabled>Loading photos…</button>
      </div>
      <img class="portrait" src="photos/098_UNDATED_Charlie Portrait.webp" alt="Portrait of Charles Ross">
    </section>
  </main>

  <div class="chrome" aria-label="Slideshow controls">
    <div class="topline"><span>In Loving Memory · Charles Ross</span><span id="counter">Opening</span></div>
    <div class="hint">Arrow keys to navigate · Space to pause · F for full screen</div>
    <div class="controls">
      <button class="control" id="previous" aria-label="Previous photo"><svg viewBox="0 0 24 24"><path d="M15.4 5.4 14 4 6 12l8 8 1.4-1.4L8.8 12z"/></svg></button>
      <button class="control" id="playPause" aria-label="Play slideshow"></button>
      <button class="control" id="next" aria-label="Next photo"><svg viewBox="0 0 24 24"><path d="M8.6 5.4 10 4l8 8-8 8-1.4-1.4 6.6-6.6z"/></svg></button>
      <button class="control" id="fullscreen" aria-label="Enter full screen"><svg viewBox="0 0 24 24"><path d="M4 4h6v2H6v4H4zm10 0h6v6h-2V6h-4zM4 14h2v4h4v2H4zm14 0h2v6h-6v-2h4z"/></svg></button>
    </div>
    <div class="progress" id="progress"></div>
  </div>
  <div class="swipe-tip" id="swipeTip">Swipe to move through photos</div>

  <script>
    const PLAYLIST_DURATION = 22 * 60 * 1000 + 24 * 1000;
    const EFFECTS = ['fade', 'slide', 'zoom', 'wipe', 'blur', 'rise', 'iris', 'door'];
    const FX_MS = 1700;
    const ICON_PAUSE = '<svg viewBox="0 0 24 24"><path d="M6 4h4v16H6zm8 0h4v16h-4z"/></svg>';
    const ICON_PLAY = '<svg viewBox="0 0 24 24"><path d="M7 4v16l13-8z"/></svg>';
    const stage = document.getElementById('stage');
    const counter = document.getElementById('counter');
    const progress = document.getElementById('progress');
    const playPause = document.getElementById('playPause');
    const fullscreenBtn = document.getElementById('fullscreen');
    let slides = [document.getElementById('cover')];
    let current = 0;
    let playing = false;
    let timer, fxTimer, wakeLock = null;
    let interval = 12000;

    if (!document.documentElement.requestFullscreen) fullscreenBtn.hidden = true;
    playPause.innerHTML = ICON_PLAY;

    // Photos load just before they're shown, so phones on mobile data don't pull everything at once.
    function load(index) {
      for (let i = index - 1; i <= index + 2; i++) {
        const img = slides[i]?.querySelector('img[data-src]');
        if (img) { img.src = img.dataset.src; img.removeAttribute('data-src'); }
        const bg = slides[i]?.querySelector('.backdrop[data-bg]');
        if (bg) { bg.style.backgroundImage = `url("${bg.dataset.bg}")`; bg.removeAttribute('data-bg'); }
      }
    }

    function show(index) {
      const previous = current;
      current = Math.max(0, Math.min(index, slides.length - 1));
      load(current);
      document.body.classList.toggle('on-cover', current === 0);
      if (current !== previous) {
        const incoming = slides[current], outgoing = slides[previous];
        slides.forEach(s => { if (s !== incoming && s !== outgoing) s.className = s.className.replace(/\b(active|leaving|entering|fx-\w+)\b/g, '').trim(); });
        outgoing.classList.remove('active', 'entering');
        outgoing.classList.add('leaving');
        incoming.className = incoming.className.replace(/\b(leaving|entering|fx-\w+)\b/g, '').trim();
        void incoming.offsetWidth; // restart the animation if this slide was shown before
        incoming.style.setProperty('--dir', current >= previous ? 1 : -1);
        incoming.classList.add('active', 'entering', `fx-${EFFECTS[(current - 1 + EFFECTS.length * 2) % EFFECTS.length]}`);
        clearTimeout(fxTimer);
        fxTimer = setTimeout(() => outgoing.classList.remove('leaving'), FX_MS + 100);
      }
      counter.textContent = current === 0 ? 'Opening' : `${current} / ${slides.length - 1}`;
      progress.style.width = `${(current / (slides.length - 1)) * 100}%`;
      if (playing) schedule();
    }

    function schedule() {
      clearTimeout(timer);
      if (!playing) return;
      if (current >= slides.length - 1) { pause(); return; }
      timer = setTimeout(() => show(current + 1), interval);
    }

    async function keepAwake() { try { wakeLock = await navigator.wakeLock?.request('screen'); } catch (_) { /* optional */ } }
    function play() {
      playing = true;
      playPause.innerHTML = ICON_PAUSE;
      playPause.setAttribute('aria-label', 'Pause slideshow');
      keepAwake();
      schedule();
    }
    function pause() {
      playing = false;
      clearTimeout(timer);
      wakeLock?.release?.().catch(() => {}); wakeLock = null;
      playPause.innerHTML = ICON_PLAY;
      playPause.setAttribute('aria-label', 'Play slideshow');
    }
    function togglePlay() {
      if (playing) return pause();
      if (current === 0 || current >= slides.length - 1) show(1);
      play();
    }
    document.addEventListener('visibilitychange', () => { if (playing && document.visibilityState === 'visible') keepAwake(); });

    async function toggleFullscreen() {
      try {
        if (!document.fullscreenElement) await document.documentElement.requestFullscreen?.();
        else await document.exitFullscreen?.();
      } catch (_) { /* Playback still works when the browser declines full screen. */ }
    }

    fetch('photos.json').then(r => r.json()).then(photos => {
      const fragment = document.createDocumentFragment();
      photos.forEach((photo, i) => {
        const src = `photos/${encodeURIComponent(photo.file)}`;
        const section = document.createElement('section');
        section.className = 'slide';
        const bg = document.createElement('div');
        bg.className = 'backdrop';
        bg.dataset.bg = src;
        bg.setAttribute('aria-hidden', 'true');
        const img = document.createElement('img');
        img.className = 'photo';
        img.dataset.src = src;
        img.alt = (photo.caption || '').trim() || `Photo ${i + 1} of Charles Ross and family`;
        img.decoding = 'async';
        section.append(bg, img);
        if (photo.date) {
          const label = document.createElement('div');
          label.className = 'date';
          label.textContent = photo.date;
          section.append(label);
        }
        fragment.append(section);
      });
      stage.append(fragment);
      slides = [...stage.querySelectorAll('.slide')];
      interval = PLAYLIST_DURATION / photos.length;
      const begin = document.getElementById('begin');
      begin.disabled = false;
      begin.textContent = 'Begin slideshow';
      load(0);
    }).catch(() => {
      document.getElementById('begin').textContent = 'Photos could not load — please refresh';
    });

    document.getElementById('begin').addEventListener('click', () => { show(1); play(); toggleFullscreen(); tip(); wake(4000); });
    document.getElementById('previous').addEventListener('click', () => show(current - 1));
    document.getElementById('next').addEventListener('click', () => show(current + 1));
    playPause.addEventListener('click', togglePlay);
    fullscreenBtn.addEventListener('click', toggleFullscreen);

    document.addEventListener('keydown', event => {
      if (event.target.closest?.('button') && (event.key === ' ' || event.key === 'Enter')) return;
      if (['ArrowRight', 'ArrowDown', 'PageDown'].includes(event.key)) show(current + 1);
      else if (['ArrowLeft', 'ArrowUp', 'PageUp'].includes(event.key)) show(current - 1);
      else if (event.key === ' ') { event.preventDefault(); togglePlay(); }
      else if (event.key.toLowerCase() === 'f') toggleFullscreen();
      else if (event.key === 'Home') show(0);
      else if (event.key === 'End') show(slides.length - 1);
      wake();
    });

    // Controls appear on movement or tap, then fade away.
    let controlsTimer;
    function wake(ms = 2800) {
      document.body.classList.add('controls-visible');
      clearTimeout(controlsTimer);
      controlsTimer = setTimeout(() => document.body.classList.remove('controls-visible'), ms);
    }
    document.addEventListener('mousemove', () => wake());

    // Touch: swipe to change photos, tap to show or hide the controls.
    let touchStart = null;
    stage.addEventListener('pointerdown', e => { if (e.pointerType === 'touch') touchStart = { x: e.clientX, y: e.clientY, t: Date.now() }; });
    stage.addEventListener('pointerup', e => {
      if (!touchStart || e.pointerType !== 'touch') return;
      const dx = e.clientX - touchStart.x, dy = e.clientY - touchStart.y, dt = Date.now() - touchStart.t;
      touchStart = null;
      if (e.target.closest('button')) return;
      if (Math.abs(dx) > 48 && Math.abs(dx) > Math.abs(dy) * 1.4 && current > 0) { show(current + (dx < 0 ? 1 : -1)); wake(); }
      else if (Math.abs(dx) < 10 && Math.abs(dy) < 10 && dt < 400 && current > 0) {
        if (document.body.classList.contains('controls-visible')) { clearTimeout(controlsTimer); document.body.classList.remove('controls-visible'); }
        else wake(4500);
      }
    });
    stage.addEventListener('pointercancel', () => { touchStart = null; });
    document.querySelector('.chrome').addEventListener('pointerdown', () => wake(4500));

    function tip() {
      if (!matchMedia('(hover:none)').matches) return;
      const el = document.getElementById('swipeTip');
      el.classList.add('show');
      setTimeout(() => el.classList.remove('show'), 4200);
    }
    wake(6000);
  </script>
</body>
</html>
